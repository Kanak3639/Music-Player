<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Music Player</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-glow"></div>
    
    <div class="app-container">
        
        <!-- Main Player UI -->
        <main class="player-wrapper glass-panel">
            <header class="player-header">
                <button class="icon-btn" aria-label="Go Back"><i class="fa-solid fa-angle-down"></i></button>
                <span class="now-playing-text">Now Playing</span>
                <button class="icon-btn" aria-label="More Options"><i class="fa-solid fa-ellipsis-vertical"></i></button>
            </header>

            <div class="art-container">
                <div class="art-wrapper">
                    <img src="" alt="Album Art" id="album-art" class="album-art">
                    <div class="art-shadow" id="art-shadow"></div>
                </div>
            </div>

            <div class="song-details">
                <h1 id="song-title" class="song-title">Song Title</h1>
                <p id="song-artist" class="song-artist">Artist Name</p>
            </div>

            <!-- Progress Area -->
            <div class="progress-container">
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="total-duration">0:00</span>
                </div>
                <div class="progress-bar-wrapper" id="progress-wrapper">
                    <div class="progress-bar" id="progress-bar">
                        <div class="progress-thumb"></div>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="icon-btn control-btn" id="repeat-btn" aria-label="Repeat"><i class="fa-solid fa-repeat"></i></button>
                <button class="icon-btn control-btn main-nav" id="prev-btn" aria-label="Previous"><i class="fa-solid fa-backward-step"></i></button>
                <button class="play-btn" id="play-pause-btn" aria-label="Play or Pause">
                    <i class="fa-solid fa-play" id="play-icon"></i>
                </button>
                <button class="icon-btn control-btn main-nav" id="next-btn" aria-label="Next"><i class="fa-solid fa-forward-step"></i></button>
                <button class="icon-btn control-btn" id="shuffle-btn" aria-label="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
            </div>

            <!-- Volume Control -->
            <div class="volume-container">
                <i class="fa-solid fa-volume-low" id="volume-icon"></i>
                <input type="range" min="0" max="100" value="100" class="volume-slider" id="volume-slider">
            </div>
            
            <!-- Open Playlist Button for Mobile -->
            <button class="show-playlist-btn" id="show-playlist-btn">
                <i class="fa-solid fa-list-ul"></i> Playlist
            </button>
        </main>

        <!-- Playlist Sidebar -->
        <aside class="playlist-wrapper glass-panel" id="playlist-drawer">
            <header class="playlist-header">
                <h2><i class="fa-solid fa-music"></i> Up Next</h2>
                <button class="icon-btn close-playlist" id="close-playlist-btn"><i class="fa-solid fa-xmark"></i></button>
            </header>
            <div class="playlist-container" id="playlist">
                <!-- Playlist Items will be dynamically inserted here -->
            </div>
        </aside>

    </div>

    <!-- Audio Element -->
    <audio id="main-audio" src=""></audio>

    <!-- Scripts -->
    <script src="js/music-list.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
